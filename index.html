<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Bluetooth AC Voltmeter Dashboard</title>
    <!-- Include Chart.js for real-time visualization -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --dark: #1f2937;
            --light: #f3f4f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 24px;
            margin-bottom: 20px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }

        .btn:hover { opacity: 0.9; }
        .btn:disabled { background-color: #9ca3af; cursor: not-allowed; }

        .display-panel {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .voltage-val {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary);
            margin: 10px 0;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            background-color: #fee2e2;
            color: var(--danger);
            margin-top: 5px;
        }

        .status-badge.connected {
            background-color: #dcfce7;
            color: var(--success);
        }

        .log-box {
            height: 180px;
            background: var(--dark);
            color: #4ade80;
            font-family: monospace;
            padding: 12px;
            border-radius: 6px;
            overflow-y: auto;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Mains AC Voltage Telemetry</h1>
        <p>ESP32 + ZMPT101B Dashboard via Web Bluetooth</p>
    </header>

    <div class="grid-2">
        <!-- Control and Display Card -->
        <div class="card display-panel">
            <h3>Connection & Live Metrics</h3>
            <button id="connectBtn" class="btn">Connect ESP32 Bluetooth</button>
            <div id="status" class="status-badge">Disconnected</div>
            <div class="voltage-val"><span id="voltValue">0.0</span> <span style="font-size: 2rem;">V</span></div>
            <p style="color: #6b7280; margin: 0;">Target Sample Stream: 1 Hz</p>
        </div>

        <!-- System Log Card -->
        <div class="card">
            <h3>Data Stream Terminal</h3>
            <div id="terminal" class="log-box">System ready. Click connect to scan for 'ESP32_Volt_Link'...</div>
        </div>
    </div>

    <!-- Chart Analytics Card -->
    <div class="card">
        <h3>Voltage Stability Graph</h3>
        <canvas id="voltageChart" height="120"></canvas>
    </div>
</div>

<script>
    // --- Global Config & Bluetooth UUIDs ---
    // Standard Nordic UART UUIDs widely used by ESP32 Classic/BLE bridging stacks
    const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const TX_CHAR_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bluetoothDevice = null;
    let txCharacteristic = null;

    // --- DOM Elements ---
    const connectBtn = document.getElementById('connectBtn');
    const statusBadge = document.getElementById('status');
    const voltValue = document.getElementById('voltValue');
    const terminal = document.getElementById('terminal');

    // --- Chart Setup ---
    const ctx = document.getElementById('voltageChart').getContext('2d');
    const maxDataPoints = 30;
    const chartData = {
        labels: [],
        datasets: [{
            label: 'Line Voltage (RMS V)',
            data: [],
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37, 99, 235, 0.1)',
            borderWidth: 2,
            tension: 0.2,
            fill: true
        }]
    };

    const config = {
        type: 'line',
        data: chartData,
        options: {
            responsive: true,
            scales: {
                y: { min: 0, max: 300, ticks: { stepSize: 50 } },
                x: { display: false }
            }
        }
    };
    const voltageChart = new Chart(ctx, config);

    // --- Core Web Bluetooth Management ---
    connectBtn.addEventListener('click', async () => {
        if (bluetoothDevice && bluetoothDevice.gatt.connected) {
            disconnectDevice();
            return;
        }

        try {
            logToTerminal("Initiating search for Bluetooth device...");
            
            // Filters based on the software transmission parameters configured on the ESP32
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'ESP32_Volt_Link' }],
                optionalServices: [UART_SERVICE_UUID]
            });

            logToTerminal(`Found target device: ${bluetoothDevice.name}. Connecting...`);
            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService(UART_SERVICE_UUID);
            txCharacteristic = await service.getCharacteristic(TX_CHAR_UUID);

            // Turn on system notifications to track serial parsing arrays asynchronously
            await txCharacteristic.startNotifications();
            txCharacteristic.addEventListener('characteristicvaluechanged', handleDataStream);

            statusBadge.textContent = "Connected";
            statusBadge.classList.add('connected');
            connectBtn.textContent = "Disconnect Device";
            logToTerminal("Data link secured! Streaming incoming live metrics...");

        } catch (error) {
            logToTerminal(`[ERROR]: ${error.message}`);
            console.error(error);
        }
    });

    function handleDataStream(event) {
        const enc = new TextDecoder("utf-8");
        const rawString = enc.decode(event.target.value).trim();
        
        logToTerminal(`Received: ${rawString}`);

        // Parsing scheme matches firmware key format -> "VOLTAGE:230.40 V"
        if (rawString.startsWith("VOLTAGE:")) {
            let processedVal = rawString.replace("VOLTAGE:", "").replace("V", "").trim();
            let parsedVoltage = parseFloat(processedVal);

            if (!isNaN(parsedVoltage)) {
                // Update Numeric Display
                voltValue.textContent = parsedVoltage.toFixed(1);

                // Append Data to Chart Object
                const now = new Date().toLocaleTimeString();
                if (chartData.labels.length >= maxDataPoints) {
                    chartData.labels.shift();
                    chartData.datasets[0].data.shift();
                }
                chartData.labels.push(now);
                chartData.datasets[0].data.push(parsedVoltage);
                voltageChart.update('none'); // Update smoothly without full redraw animations
            }
        }
    }

    function disconnectDevice() {
        if (!bluetoothDevice) return;
        logToTerminal("Disconnecting current active hardware link...");
        bluetoothDevice.gatt.disconnect();
    }

    function onDisconnected() {
        statusBadge.textContent = "Disconnected";
        statusBadge.classList.remove('connected');
        connectBtn.textContent = "Connect ESP32 Bluetooth";
        logToTerminal("Hardware node connection severed.");
    }

    function logToTerminal(message) {
        const timestamp = new Date().toLocaleTimeString();
        terminal.innerHTML += `<div>[${timestamp}] ${message}</div>`;
        terminal.scrollTop = terminal.scrollHeight;
    }
</script>
</body>
</html>
